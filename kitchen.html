<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://api.country.is; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cook</title>
<link rel="preload" href="fonts/Fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/DMSans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/fridge.css">
</head>
<body data-page="layout">

<button id="btn-options" class="btn-options" type="button" aria-haspopup="dialog" data-i18n-label="options">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h.01M8.5 6H20M4 12h.01M8.5 12H20M4 18h.01M8.5 18H20"/></svg>
</button>

<dialog id="options-dialog" class="dialog" aria-labelledby="options-title">
  <form method="dialog">
    <h2 id="options-title" data-i18n="options">Options</h2>
    <fieldset class="choices">
      <legend data-i18n="theme">Theme</legend>
      <div class="segmented">
        <label class="seg" title="Light"><input type="radio" name="theme" value="light" checked><span class="sr-only" data-i18n="themeLight">Light</span>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></label>
        <label class="seg" title="Dark"><input type="radio" name="theme" value="dark"><span class="sr-only" data-i18n="themeDark">Dark</span>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></label>
        <label class="seg seg-text"><input type="radio" name="theme" value="system"><span data-i18n="themeSystem">System</span></label>
      </div>
    </fieldset>
    <fieldset class="choices">
      <legend data-i18n="units">Units</legend>
      <div class="choices-row">
        <label class="choice"><input type="radio" name="units" value="metric" checked> <span data-i18n="metric">Metric</span></label>
        <label class="choice"><input type="radio" name="units" value="imperial"> <span data-i18n="imperial">Imperial</span></label>
      </div>
    </fieldset>
    <label class="field field-inline">
      <span class="field-label" data-i18n="language">Language</span>
      <select id="lang-select">
        <option value="en">English (EN)</option>
      </select>
    </label>
    <div class="field">
      <span class="field-label" data-i18n="kitchenLayout">Kitchen layout</span>
      <button id="btn-layout" class="btn btn-secondary btn-small" type="button" data-i18n="setupLayout">Set up kitchen layout</button>
    </div>
    <button class="btn btn-primary btn-wide" value="save" data-i18n="save">Save</button>
  </form>
</dialog>

<dialog id="nolayout-dialog" class="dialog exit-dialog nolayout-dialog" aria-labelledby="nolayout-title">
  <h2 id="nolayout-title" data-i18n="noLayoutAsk">You don't have the kitchen layout set up. Continue in list view only?</h2>
  <div class="dialog-actions">
    <button id="nolayout-setup" class="btn btn-primary" type="button" data-i18n="noSetUp">No, let's set it up</button>
    <button id="nolayout-yes" class="btn btn-secondary" type="button" data-i18n="yes">Yes</button>
  </div>
</dialog>

<dialog id="exit-dialog" class="dialog exit-dialog" aria-labelledby="exit-title">
  <h2 id="exit-title" data-i18n="giveUp">You want to give up?</h2>
  <div class="dialog-actions">
    <button id="exit-no" class="btn btn-secondary" type="button" data-i18n="no">No</button>
    <button id="exit-yes" class="btn btn-primary" type="button" data-i18n="yes">Yes</button>
  </div>
</dialog>

<dialog id="read-dialog" class="dialog read-dialog" aria-labelledby="read-title">
  <h2 id="read-title"></h2>
  <div id="read-body" class="read-body"></div>
  <p id="here-badge" class="here-badge" role="status" hidden data-i18n="youAreHere">You are here now!</p>
  <div class="dialog-actions">
    <button class="btn btn-secondary" type="button" disabled data-i18n="share">Share</button>
    <button id="read-close" class="btn btn-primary" type="button" data-i18n="close">Close</button>
  </div>
</dialog>

<main id="app">
  <section id="screen-layout" class="screen screen-layout">
    <div class="layout-bar">
      <button id="btn-layout-cancel" class="btn btn-secondary btn-small" type="button" data-i18n="cancel">Cancel</button>
      <span class="hint" data-i18n="layoutHelp">Drag to move, drag the corner to resize. Things can only overlap the countertop.</span>
      <button id="btn-layout-theme" class="btn btn-secondary btn-small btn-icon" type="button" data-i18n-label="toggleTheme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
      <button id="btn-layout-textures" class="btn btn-secondary btn-small btn-icon btn-textures" type="button" aria-pressed="true" data-i18n-label="toggleTextures">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 3.5 10 13"/><path d="M14.5 4.5 18 3l2 2-1.5 3.5L12 15l-3-3z"/><path d="M8.5 13.5c-2.5 0-4 1.6-4 4 0 1.4-.6 2.3-1.5 3 3.5.6 7.5-.4 7.5-4.5z"/></svg>
      </button>
      <button class="btn btn-secondary btn-small btn-icon btn-rotate" type="button" data-i18n-label="rotateScreen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="to-landscape"><rect x="3" y="6.5" width="18" height="11" rx="2"/><path d="M17.5 12h.01"/></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="to-portrait"><rect x="6.5" y="3" width="11" height="18" rx="2"/><path d="M12 17.5h.01"/></svg></button>
      <button id="btn-layout-save" class="btn btn-primary btn-small" type="button" data-i18n="save">Save</button>
    </div>
    <div id="layout-canvas" class="canvas"></div>
    <div class="layout-add">
      <div id="layout-add-menu" class="layout-add-menu" hidden></div>
      <button id="btn-layout-add" class="btn btn-primary btn-layout-add" type="button" data-i18n-label="addToKitchen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </section>
</main>

<button id="due-toast" class="due-toast" type="button" hidden></button>

<button id="jump-bottom" class="jump-bottom" type="button" hidden data-i18n-label="jumpBottom">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>

<div id="step-pop" class="step-pop" role="dialog" aria-modal="false" hidden>
  <button id="step-pop-close" class="step-pop-close" type="button" data-i18n-label="close">&times;</button>
  <div id="step-pop-body"></div>
</div>
<div id="step-pop-arrow" class="step-pop-arrow" aria-hidden="true" hidden></div>

<div id="tip" class="tip" role="status" hidden>
  <div class="tip-body">
    <p class="tip-label" id="tip-label"></p>
    <p class="tip-text" id="tip-text"></p>
  </div>
  <button id="tip-close" class="tip-close" type="button" data-i18n-label="dismissTip">&times;</button>
</div>

<script src="js/page-session.js"></script>
<script src="js/cook-core.js"></script>
<script src="js/recipes-sheet.js"></script>
<script src="js/recipes.js"></script>
<script src="js/fridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
